<!doctype html>
<html lang="en" data-theme="light" data-font="medium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Dispatch console and driver app for Lagos courier operators." />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/fonts/inter/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <title>Logistics Routing</title>
    <script>
      // Apply the saved theme and text size before first paint, as GDS does.
      (function () {
        try {
          var r = document.documentElement;
          var mode = localStorage.getItem('lr_theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.setAttribute('data-font', localStorage.getItem('lr_font') || 'medium');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
